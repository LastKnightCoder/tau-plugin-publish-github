name: 验证与发布插件
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v5
      - name: 校验版本
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from "node:fs";
          const manifest = JSON.parse(readFileSync("manifest.json", "utf8"));
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          if (manifest.version !== pkg.version)
            throw new Error("manifest 与 package 版本不一致");
          if (process.env.RELEASE_TAG && process.env.RELEASE_TAG !== "v" + pkg.version)
            throw new Error("标签与插件版本不一致");
          appendFileSync(process.env.GITHUB_ENV,
            `ARCHIVE=dist/${manifest.id}-${manifest.version}.zip\nPRERELEASE=${pkg.version.includes("-")}\n`);
          NODE
      - name: 安装公共依赖
        run: pnpm install --frozen-lockfile
      - name: 测试
        run: pnpm test
      - name: 类型检查与构建
        run: pnpm build
      - name: 发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # 同版本提交按 ZIP 摘要幂等，重跑必须复用已经发布的归档。
            gh release download "$RELEASE_TAG" --pattern "$(basename "$ARCHIVE")" --dir dist --clobber
          else
            args=(--verify-tag --title "$RELEASE_TAG" --notes-file CHANGELOG.md)
            if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "$ARCHIVE" "${args[@]}"
          fi
      - name: 提交到 Tau 插件中心
        if: startsWith(github.ref, 'refs/tags/') && env.PRERELEASE == 'false'
        env:
          PORTAL_API: https://plugins-api.taunote.app
        run: |
          token=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$PORTAL_API" | jq -er '.value | select(type == "string" and length > 0)')
          echo "::add-mask::$token"
          status=$(curl -sS -o portal-response.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" -H "Content-Type: application/zip" \
            --data-binary "@$ARCHIVE" "$PORTAL_API/v1/ci/releases")
          cat portal-response.json; echo
          if [ "$status" = "404" ]; then
            echo "::error::请先在 https://plugins.taunote.app 网页提交一次插件并绑定当前仓库，再重跑本次工作流"
          fi
          test "$status" -ge 200 && test "$status" -lt 300
